<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Power Hour – Connecting...</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#080808; color:#f0ece4; font-family:'Space Mono',monospace; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.5rem; }
  .logo { font-family:'Bebas Neue',sans-serif; font-size:5rem; background:linear-gradient(135deg,#ff3c00,#ffb300); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .msg { font-size:.75rem; letter-spacing:.2em; color:#666; text-transform:uppercase; }
  .spinner { width:36px; height:36px; border:3px solid #222; border-top-color:#ff3c00; border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .error { color:#ff3c00; font-size:.8rem; text-align:center; max-width:400px; line-height:1.6; }
</style>
</head>
<body>
<div class="logo">Power Hour</div>
<div class="spinner" id="spinner"></div>
<div class="msg" id="msg">Connecting to Spotify...</div>
<div class="error hidden" id="err"></div>

<script>
  (async () => {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');

    if (error) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('msg').textContent = 'Login cancelled';
      document.getElementById('err').textContent = 'Spotify login was cancelled or denied. Redirecting back...';
      document.getElementById('err').classList.remove('hidden');
      setTimeout(() => window.location.href = '/power-hour/', 2000);

      return;
    }

    if (!code) {
      window.location.href = '/power-hour/';
      return;
    }

    // Store code for the main app to pick up
    sessionStorage.setItem('spotify_auth_code', code);

    // Clean the URL
    window.history.replaceState({}, '', '/callback');

    document.getElementById('msg').textContent = 'Authenticated! Loading app...';

    // Redirect to main app
    setTimeout(() => {
      window.location.href = '/power-hour/';
    }, 500);
  })();
</script>
</body>
</html>
