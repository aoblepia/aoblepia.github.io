<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Power Hour</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    :root {
      --main-bg: #0d0d0d;
      --accent-color: #ffd700;
      --text-color: white;
      --pulse-color: #222;
    }

    body {
      background-color: var(--main-bg);
      color: var(--text-color);
      font-family: Helvetica, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    #visualizer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: radial-gradient(circle at center, var(--pulse-color) 0%, #000000 100%);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% {
        filter: brightness(1);
      }
      50% {
        filter: brightness(1.3);
      }
    }

    .hidden {
      display: none;
    }

    input, label {
      display: block;
      margin: 10px auto;
      font-size: 1.2em;
    }

    button {
      padding: 1rem 2rem;
      font-size: 1.2rem;
      background-color: var(--accent-color);
      color: black;
      border: none;
      border-radius: 1rem;
      margin-top: 2rem;
      cursor: pointer;
    }

    #album-art {
      width: 300px;
      height: 300px;
      object-fit: cover;
      border-radius: 1rem;
      margin-top: 1rem;
    }

    #countdown {
      font-size: 5rem;
      color: var(--accent-color);
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <div id="visualizer"></div>
  <div id="app">
    <header>
      <h1>🎵 Power Hour</h1>
    </header>

    <section id="setup">
      <label>
        Playlist URI:
        <input type="text" id="playlist-uri" placeholder="spotify:playlist:...">
      </label>

      <label>
        Snippet Length (seconds):
        <input type="number" id="snippet-length" value="20" min="5" max="60">
      </label>

      <label>
        Number of Songs:
        <input type="number" id="number-of-songs" value="60" min="1" max="100">
      </label>

      <button id="start-button">Start Power Hour</button>
    </section>

    <section id="player" class="hidden">
      <div id="track-number"></div>
      <img id="album-art" src="" alt="Album Art" />
      <div id="track-info">
        <h2 id="track-name"></h2>
        <p id="artist-name"></p>
        <p id="user-name">Added by: ???</p>
      </div>
      <h1 id="countdown">20</h1>
    </section>

    <audio id="ding" src="mario_coin_sound.mp3" preload="auto"></audio>
    <script src="script.js"></script>
  </div>
</body>
</html>
